{% extends 'generic/edit.html' %}
{% block javascript %}
<script>
  $(document).ready(function () {
    var api_url = document.getElementById("id_api_url");
    var api_key = document.getElementById("id_api_key");
    var api_secret = document.getElementById("id_api_secret");
    var timeout = null;
    var ixapi = {% if instance.pk %}{{ instance.pk }}{% else %}null{% endif %};

    function getAccounts() {
      // Without a known IX-API, every detail must be given
      if (!ixapi && (api_url.value.length < 1 || api_key.value.length < 1 || api_secret.value.length < 1)) {
        return;
      }

      var data = {
        api_url: api_url.value,
        api_key: api_key.value,
        api_secret: api_secret.value,
      };
      // The key and the secret of a known IX-API stay on the server
      if (ixapi) {
        data.ixapi = ixapi;
      }

      $.ajax({
        method: "post",
        url: "{% url 'extras-api:ixapi-accounts' %}",
        headers: { "X-CSRFTOKEN": "{{ csrf_token }}" },
        data: data
      }).done(function (r) {
        PeeringManager.populateTomSelect($('#id_identity'), r);
      });
    }

    [ api_url, api_key, api_secret ].forEach(function (element) {
      element.addEventListener("keyup", function () {
        clearTimeout(timeout);
        timeout = setTimeout(getAccounts, 500);
      });
    });
    {% if instance.pk %}
    getAccounts();
    {% endif %}
  });
</script>
{% endblock %}
