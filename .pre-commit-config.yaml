---
repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.5
  hooks:
  - id: uv-lock

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.7.4
  hooks:
  - id: ruff
  - id: ruff-format

- repo: local
  hooks:
  - id: requirement.txt
    name: requirement.txt
    entry: ./scripts/requirements.sh
    files: uv.lock
    language: system
